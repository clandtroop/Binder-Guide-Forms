<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Policy Reference</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #ffffff;
    --page-plane:     #f6f8fa;
    --text-primary:   #131922;
    --text-secondary: #5d6773;
    --text-muted:     #8892a0;
    --gridline:       #e7eaef;
    --border:         rgba(19,25,34,0.08);
    --brand:          #0053a1; /* Rotech navbar / primary blue */
    --series-1: #0053a1; /* Corporate (blue) */
    --series-2: #1d7a4d; /* Operations (green) */
    --series-3: #6b4fbb; /* Information Management (violet) */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #171b21;
      --page-plane:     #0d0f13;
      --text-primary:   #ffffff;
      --text-secondary: #c3c8d1;
      --text-muted:     #8892a0;
      --gridline:       #2a2f38;
      --border:         rgba(255,255,255,0.10);
      --brand:          #2e7fd6;
      --series-1: #2e7fd6;
      --series-2: #2f9e68;
      --series-3: #8a72d6;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #171b21;
    --page-plane:     #0d0f13;
    --text-primary:   #ffffff;
    --text-secondary: #c3c8d1;
    --text-muted:     #8892a0;
    --gridline:       #2a2f38;
    --border:         rgba(255,255,255,0.10);
    --brand:          #2e7fd6;
    --series-1: #2e7fd6;
    --series-2: #2f9e68;
    --series-3: #29b8dc;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz-root {
    display: block;
    min-height: 100vh;
    background: var(--page-plane);
    color: var(--text-primary);
  }

  /* top navbar, styled after the Accreditation Survey Prep app */
  .app-nav {
    background: var(--brand);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 20px;
  }
  .app-nav .brand-mark {
    background: #ffffff;
    color: var(--brand);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.02em;
    padding: 7px 14px;
    border-radius: 999px;
  }
  .app-nav .app-title {
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
  }
  .app-nav .spacer { flex: 1 1 auto; }
  .app-nav .app-meta {
    color: rgba(255,255,255,0.85);
    font-size: 12px;
  }
  .app-nav .theme-toggle {
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.12);
    color: #ffffff;
    font-size: 12px;
    padding: 6px 13px;
    border-radius: 999px;
    cursor: pointer;
  }
  .app-nav .theme-toggle:hover { background: rgba(255,255,255,0.22); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }

  header.page-head { margin-bottom: 22px; }
  header.page-head h1 {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }
  header.page-head p.sub {
    margin: 0;
    color: var(--text-secondary);
    font-size: 13.5px;
  }

  /* controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  #search {
    flex: 1 1 220px;
    min-width: 180px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
    font-size: 13.5px;
  }
  #search:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    user-select: none;
    font-weight: 600;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip[data-active="true"] {
    color: #ffffff;
    border-color: transparent;
    background: var(--chip-accent, var(--brand));
  }
  .chip[data-active="true"] .dot { background: #ffffff !important; }

  /* policy card grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  @media (max-width: 920px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-top: 4px solid var(--accent, var(--series-1));
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(19,25,34,0.06), 0 1px 2px rgba(19,25,34,0.04);
    display: flex;
    flex-direction: column;
  }

  .photo {
    background: var(--gridline);
    aspect-ratio: 16 / 10;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo .badge {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--accent, var(--series-1)) 14%, transparent);
  }
  .photo .badge svg {
    width: 26px;
    height: 26px;
    color: var(--accent, var(--series-1));
  }

  .card-body { padding: 14px 16px 16px; flex: 1 1 auto; }
  .field { margin-bottom: 11px; }
  .field:last-child { margin-bottom: 0; }
  .field .flabel {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .field .fvalue {
    font-size: 13.5px;
    color: var(--text-primary);
    font-weight: 600;
    line-height: 1.35;
  }
  .field .fvalue.plain { font-weight: 400; }
  .field .fvalue.blank { color: var(--text-muted); font-weight: 400; font-style: italic; }

  .code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--accent, var(--series-1));
    background: color-mix(in srgb, var(--accent, var(--series-1)) 14%, transparent);
    padding: 2px 7px;
    border-radius: 5px;
    display: inline-block;
  }

  .link-btn {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent, var(--series-1));
    border: 1px dashed color-mix(in srgb, var(--accent, var(--series-1)) 45%, transparent);
    background: color-mix(in srgb, var(--accent, var(--series-1)) 8%, transparent);
    padding: 4px 10px;
    border-radius: 999px;
    text-decoration: none;
    white-space: nowrap;
  }
  .link-btn:hover {
    color: #ffffff;
    background: var(--accent, var(--series-1));
    border-style: solid;
  }

  .chapter-tag { display: inline-flex; align-items: center; gap: 5px; color: var(--accent, var(--series-1)); }
  .chapter-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent, var(--series-1)); flex: none; }

  .status-tag { display: inline-flex; align-items: center; gap: 5px; color: var(--series-2); }
  .status-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--series-2); flex: none; }

  footer.note {
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
    border-top: 1px solid var(--gridline);
    padding-top: 14px;
  }
  footer.note code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: var(--gridline);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="viz-root">

  <nav class="app-nav">
    <span class="brand-mark">ROTECH</span>
    <span class="app-title">Accreditation</span>
    <span class="spacer"></span>
    <span class="app-meta">Binder Policy Reference</span>
    <button class="theme-toggle" id="themeToggle" type="button">🌙 Dark mode</button>
  </nav>

  <div class="wrap">

    <header class="page-head">
      <h1>Master Policy Reference</h1>
      <p class="sub">Click "View Policy" on the Policy Card you want to review.</p>
    </header>

    <div class="controls">
      <input id="search" type="text" placeholder="Search by policy number or title…">
      <div class="chip" data-filter="all" data-active="true" style="--chip-accent: var(--text-secondary)"><span class="dot" style="background:var(--text-muted)"></span>All</div>
      <div class="chip" data-filter="Corporate" style="--chip-accent: var(--series-1)"><span class="dot" style="background:var(--series-1)"></span>Corporate</div>
      <div class="chip" data-filter="Operations" style="--chip-accent: var(--series-2)"><span class="dot" style="background:var(--series-2)"></span>Operations</div>
      <div class="chip" data-filter="Information Management" style="--chip-accent: var(--series-3)"><span class="dot" style="background:var(--series-3)"></span>Info Mgmt</div>
    </div>

    <div class="grid" id="grid"></div>

    <footer class="note">
    </footer>

  </div>
</div>

  div.innerHTML = iconSvg(name);

const grid = document.getElementById("grid");

POLICIES.forEach(p => {
  const accent = CHAPTER_ACCENT[p.chapter] || "var(--series-1)";
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.chapter = p.chapter;
  card.dataset.search = (p.num + " " + p.title + " " + p.chapter + " " + (p.binder || "")).toLowerCase();
  card.style.setProperty("--accent", accent);
  card.innerHTML = `
    <div class="photo">
      <img src="${p.photo}" alt="${p.title}" data-icon="${p.icon}" onerror="handlePhotoError(this)">
    </div>
    <div class="card-body">
      <div class="field">
        <div class="flabel">Binder</div>
        <div class="fvalue ${p.binder ? "" : "blank"}">${p.binder || "—"}</div>
      </div>
      <div class="field">
        <div class="flabel">Policy Number</div>
        <div class="fvalue"><span class="code">${p.num}</span></div>
      </div>
      <div class="field">
        <div class="flabel">Policy Link</div>
        <div class="fvalue"><a class="link-btn" href="${p.link}" target="_blank" rel="noopener">View Policy ↗</a></div>
      </div>
      <div class="field">
        <div class="flabel">Policy Title</div>
        <div class="fvalue plain">${p.title}</div>
      </div>
      <div class="field">
        <div class="flabel">Chapter</div>
        <div class="fvalue"><span class="chapter-tag"><span class="dot"></span>${p.chapter}</span></div>
      </div>
      <div class="field">
        <div class="flabel">Status</div>
        <div class="fvalue"><span class="status-tag"><span class="dot"></span>Active</span></div>
      </div>
      <div class="field">
        <div class="flabel">Modified</div>
        <div class="fvalue plain">${p.modified}</div>
      </div>
    </div>
  `;
  grid.appendChild(card);
});

// filtering
let activeChapter = "all";
const searchInput = document.getElementById("search");
const chips = document.querySelectorAll(".chip");

function applyFilters() {
  const q = searchInput.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(card => {
    const matchesChapter = activeChapter === "all" || card.dataset.chapter === activeChapter;
    const matchesSearch = !q || card.dataset.search.includes(q);
    card.classList.toggle("hidden", !(matchesChapter && matchesSearch));
  });
}

chips.forEach(chip => {
  chip.addEventListener("click", () => {
    activeChapter = chip.dataset.filter;
    chips.forEach(c => c.dataset.active = String(c === chip));
    applyFilters();
  });
});
searchInput.addEventListener("input", applyFilters);

// theme toggle
const toggleBtn = document.getElementById("themeToggle");
toggleBtn.addEventListener("click", () => {
  const root = document.documentElement;
  const isDark = root.getAttribute("data-theme") === "dark";
  root.setAttribute("data-theme", isDark ? "light" : "dark");
  toggleBtn.textContent = isDark ? "🌙 Dark mode" : "☀️ Light mode";
});
</script>
